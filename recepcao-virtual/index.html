<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colmeia Studios Academy — Configuração da recepção virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#E8E2D9;
  --fundo:#14100B;
  --papel:rgba(255,255,255,.05);
  --ameixa:#1A130C;
  --rosa:#F2A71B;
  --rosa-suave:rgba(242,167,27,.14);
  --ouro:#F2A71B;
  --linha:rgba(255,255,255,.12);
  --cinza:#D6CEC4;
  --erro:#FF9E8A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{
  font-family:'Instrument Sans',sans-serif;
  background:var(--fundo);
  color:var(--tinta);
  line-height:1.55;
  font-size:16px;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---------- CABEÇALHO ---------- */
header{
  background:radial-gradient(circle at 85% 12%,rgba(242,167,27,.25),transparent 45%),radial-gradient(circle at 8% 95%,rgba(242,167,27,.12),transparent 40%),#14100B;
  color:#fff;
  padding:56px 0 48px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute;right:-80px;top:-80px;
  width:320px;height:320px;border-radius:50%;
  border:1px solid rgba(242,167,27,.22);
}
header::before{
  content:"";
  position:absolute;right:-40px;top:-40px;
  width:200px;height:200px;border-radius:50%;
  border:1px solid rgba(242,167,27,.3);
}
.lang{position:absolute;top:22px;right:24px;display:flex;gap:8px;z-index:3}
.lang button{
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;
  padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .15s;
}
.lang button:hover{background:rgba(255,255,255,.18)}
.lang button[aria-pressed=true]{background:var(--rosa);border-color:var(--rosa);font-weight:700;color:#14100B}
.logo{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:clamp(19px,2.4vw,23px);letter-spacing:.02em;color:var(--rosa);
  margin-bottom:14px;
}
.logo span{color:var(--tinta);font-weight:600}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ouro);
  display:flex;align-items:center;gap:12px;
}
.eyebrow::before{content:"";width:36px;height:1px;background:var(--ouro)}
header h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;
  font-size:clamp(30px,4.5vw,46px);
  line-height:1.15;
  margin:18px 0 14px;
  max-width:640px;
}
header h1 em{font-style:normal;color:var(--rosa)}
header p.lead{
  max-width:560px;color:rgba(255,255,255,.82);
  font-size:17px;font-weight:300;
}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  padding:6px 14px;color:rgba(255,255,255,.85);
}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;gap:48px;padding:48px 0 80px}
aside{position:sticky;top:24px;align-self:start}
aside .menu-titulo{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--cinza);margin-bottom:14px;
}
aside nav a{
  display:flex;gap:12px;align-items:baseline;
  padding:9px 10px;border-left:2px solid var(--linha);
  text-decoration:none;color:var(--cinza);
  font-size:14.5px;transition:color .15s,border-color .15s,background .15s;
}
aside nav a:hover{color:var(--rosa);background:rgba(242,167,27,.08)}
aside nav a.ativo{color:var(--rosa);border-left-color:var(--rosa);font-weight:600}
aside nav a .num{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;color:var(--ouro);min-width:26px;
}
.progresso{margin-top:22px;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--papel)}
.progresso .rotulo{font-size:12px;color:var(--cinza);margin-bottom:8px}
.barra{height:6px;background:var(--rosa-suave);border-radius:99px;overflow:hidden}
.barra>span{display:block;height:100%;width:0;background:var(--rosa);transition:width .3s}
.progresso .pct{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px;color:var(--rosa)}

/* ---------- SEÇÕES ---------- */
section.bloco{margin-bottom:56px;scroll-margin-top:24px}
.cabeca{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid rgba(242,167,27,.55);padding-bottom:10px;margin-bottom:6px}
.cabeca .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;color:var(--ouro)}
.cabeca h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px}
.descricao{color:var(--cinza);font-size:14.5px;margin:10px 0 22px;max-width:640px}

.card{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:26px}
.campo{margin-bottom:20px}
.campo:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
label .opc{font-weight:400;color:var(--cinza);font-size:12.5px}
.ajuda{font-size:13px;color:var(--cinza);margin-bottom:8px;margin-top:-2px}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=time],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--linha);border-radius:9px;
  font-family:'Instrument Sans',sans-serif;font-size:15px;color:var(--tinta);background:rgba(255,255,255,.06);
  transition:border-color .15s,box-shadow .15s;
}
input::placeholder,textarea::placeholder{color:#9C948B;opacity:1}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px rgba(242,167,27,.2);
}
 textarea{resize:vertical;min-height:84px}
 /* Opções do menu suspenso: os navegadores abrem a lista nativa em fundo branco;
    sem esta regra, o texto claro do tema escuro fica ilegível dentro dela. */
 select option{color:#14100B;background:#FFFFFF}
.falta{border-color:var(--erro)!important;box-shadow:0 0 0 3px rgba(176,58,58,.12)!important}

/* radio-cards */
.opcoes{display:grid;gap:10px}
.opcoes.col3{grid-template-columns:repeat(3,1fr)}
.radio-card{position:relative;display:block;cursor:pointer}
.radio-card input{position:absolute;opacity:0}
.radio-card .face{
  border:1.5px solid var(--linha);border-radius:10px;padding:12px 14px;
  font-size:14.5px;background:rgba(255,255,255,.06);transition:all .15s;display:flex;flex-direction:column;gap:2px;
}
.radio-card .face b{font-weight:600}
.radio-card .face small{color:var(--cinza);font-size:12.5px}
.radio-card input:checked+.face{border-color:var(--rosa);background:var(--rosa-suave)}
.radio-card input:focus-visible+.face{box-shadow:0 0 0 3px rgba(242,167,27,.3)}

/* tabelas dinâmicas */
.tabela-dinamica{border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.linha-campos{display:grid;gap:10px;padding:14px;background:rgba(255,255,255,.06);border-bottom:1px solid var(--linha);align-items:center}
.linha-campos.cabecalho-tabela{background:var(--rosa-suave);font-weight:600;font-size:12.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;color:var(--ameixa);padding:10px 14px}
.linha-campos input,.linha-campos select{padding:9px 11px;font-size:14px}
.remover{
  border:none;background:none;color:var(--cinza);cursor:pointer;font-size:18px;
  padding:6px;border-radius:8px;line-height:1;
}
.remover:hover{color:var(--erro);background:rgba(176,58,58,.08)}
.remover:disabled{opacity:.25;cursor:default}
.adicionar{
  margin-top:14px;border:1.5px dashed var(--rosa);color:var(--rosa);background:none;
  padding:10px 18px;border-radius:10px;font-family:'Instrument Sans',sans-serif;font-weight:600;
  font-size:14px;cursor:pointer;transition:background .15s;
}
.adicionar:hover{background:var(--rosa-suave)}
.acao-linha{display:flex;justify-content:flex-end;min-width:36px}

.horarios .linha-campos{grid-template-columns:110px 1fr 1fr 36px}
.servicos .linha-campos{grid-template-columns:2.2fr 1fr .9fr 2fr 36px}
.equipe .linha-campos{grid-template-columns:1.2fr 1fr 1.4fr 36px}

/* switches (sim/não) */
.sn{display:flex;gap:0;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden;width:fit-content}
.sn label{position:relative;cursor:pointer;margin:0}
.sn input{position:absolute;opacity:0}
.sn .face{padding:9px 20px;font-size:14px;font-weight:600;color:var(--cinza);background:rgba(255,255,255,.06);transition:all .15s}
.sn label:first-child .face{border-right:1.5px solid var(--linha)}
.sn input:checked+.face{background:var(--rosa);color:#14100B}
.sn input:focus-visible+.face{box-shadow:inset 0 0 0 3px rgba(242,167,27,.4)}

/* ---------- AÇÃO FINAL ---------- */
.final{
  background:#1A130C;color:#fff;border:1px solid rgba(242,167,27,.35);border-radius:18px;padding:34px;
}
.final h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;margin-bottom:8px}
.final p{color:rgba(255,255,255,.8);font-size:14.5px;max-width:560px;margin-bottom:22px}
.final .botoes{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  border:none;border-radius:11px;padding:14px 24px;font-family:'Instrument Sans',sans-serif;
  font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,background .15s;
}
.btn:active{transform:scale(.98)}
.btn-principal{background:var(--rosa);color:#14100B}
.btn-principal:hover{background:#FFB63F}
.btn-secundario{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-secundario:hover{background:rgba(255,255,255,.2)}
.saida{display:none;margin-top:24px}
.saida.visivel{display:block}
.saida label{color:#fff;font-size:13px;font-weight:600;margin:10px 0 6px}
.saida textarea{
  width:100%;min-height:320px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  background:rgba(255,255,255,.97);color:#14100B;border-radius:12px;padding:18px;line-height:1.6;
}
.aviso-campos{
  display:none;background:rgba(176,58,58,.16);border:1px solid rgba(255,150,150,.5);
  color:#FFD9D9;border-radius:10px;padding:12px 16px;font-size:14px;margin-bottom:16px;
}
.aviso-campos.visivel{display:block}

footer{
  border-top:1px solid var(--linha);padding:28px 0 48px;color:var(--cinza);font-size:13px;
}
footer b{color:var(--rosa)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--rosa);color:#14100B;font-weight:600;padding:12px 22px;border-radius:99px;font-size:14px;
  opacity:0;transition:all .3s;pointer-events:none;z-index:99;
}
.toast.visivel{opacity:1;transform:translateX(-50%) translateY(0)}

/* Revisão funcional: preserva tokens, fontes e composição originais. */
[hidden]{display:none!important}
main,.grid2>*,.grid3>*,.linha-campos>*{min-width:0}
.campo,.linha-campos,.final{overflow-wrap:anywhere}
.linha-campos label{margin:0;font-size:12px}
.linha-campos label span{display:block;margin-bottom:4px}
.servicos .linha-campos:not(.cabecalho-tabela),.equipe .linha-campos:not(.cabecalho-tabela){grid-template-columns:repeat(2,minmax(0,1fr))}
.servicos .cabecalho-tabela,.equipe .cabecalho-tabela{display:none}
.erro-campo{color:var(--erro);font-size:13px;display:block;margin:4px 0}
.aviso-campos a{color:inherit;text-decoration:underline}
.armazenamento{margin-bottom:24px}
.armazenamento label input{margin-right:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.destaque{animation:colmeia-pulse 2s ease}
@keyframes colmeia-pulse{0%{box-shadow:0 0 0 0 rgba(242,167,27,0)}30%{box-shadow:0 0 0 10px rgba(242,167,27,.45)}100%{box-shadow:0 0 0 0 rgba(242,167,27,0)}}
.sn{max-width:100%;flex-wrap:wrap}
.sn .face{padding:9px 12px}
:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}
#statusAcao,#avisoWhats{margin-top:16px}
#resumoImpressao pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:'Instrument Sans',sans-serif}
@media(max-width:880px){
 .wrap{padding:0 16px}.layout{grid-template-columns:1fr;gap:24px;padding-top:24px}
 aside{position:static}
 header{padding-top:64px}.lang{top:16px;right:16px}
 aside nav{display:flex;flex-wrap:wrap}aside nav a{font-size:13px}
 .card{padding:18px}.final{padding:22px}
 .opcoes.col3{grid-template-columns:1fr}
 .radio-card{min-width:0}
 input[type=text],input[type=tel],input[type=email],input[type=url],input[type=time],input[type=number],select,textarea,.linha-campos input,.linha-campos select,.saida textarea{font-size:16px}
 .linha-campos.cabecalho-tabela{display:none}
 .horarios .linha-campos{grid-template-columns:repeat(2,minmax(0,1fr))}
 .botoes .btn{width:100%;padding:14px 12px}
}
@media(max-width:420px){.servicos .linha-campos:not(.cabecalho-tabela),.equipe .linha-campos:not(.cabecalho-tabela){grid-template-columns:1fr}}
@media print{
 body>*{display:none!important}.wrap.layout{display:block!important}
 aside,.lang,main>*{display:none!important}main,#resumoImpressao:not([hidden]){display:block!important}
 #resumoImpressao pre{white-space:pre-wrap;overflow:visible;max-height:none}
 body{color:#000;background:#fff}.wrap{max-width:none;padding:0}
}
</style>
</head>
<body>

<header>
  <div class="lang" role="group" aria-label="Language / Idioma">
    <button type="button" id="btnEn" aria-pressed="false">EN</button>
    <button type="button" id="btnPt" aria-pressed="true">PT</button>
  </div>
  <div class="wrap">
    <div class="logo">Colmeia <span>Studios Academy</span></div>
    <div class="eyebrow" data-i18n="tag"></div>
    <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em><span data-i18n="h1c"></span></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="badges">
      <span class="badge" data-i18n="badge1"></span>
      <span class="badge" data-i18n="badge2"></span>
      <span class="badge" data-i18n="badge3"></span>
      <span class="badge" data-i18n="badge4"></span>
    </div>
  </div>
</header>

<div class="wrap layout">

  <aside>
    <div class="menu-titulo" data-i18n="menuTitulo"></div>
    <nav id="menu">
      <a href="#s1"><span class="num">I</span> <span data-i18n="nav1"></span></a>
      <a href="#s2"><span class="num">II</span> <span data-i18n="nav2"></span></a>
      <a href="#s3"><span class="num">III</span> <span data-i18n="nav3"></span></a>
      <a href="#s4"><span class="num">IV</span> <span data-i18n="nav4"></span></a>
      <a href="#s5"><span class="num">V</span> <span data-i18n="nav5"></span></a>
      <a href="#s6"><span class="num">VI</span> <span data-i18n="nav6"></span></a>
      <a href="#s7"><span class="num">VII</span> <span data-i18n="nav7"></span></a>
      <a href="#s8"><span class="num">VIII</span> <span data-i18n="nav8"></span></a>
    </nav>
    <div class="progresso">
      <div class="rotulo" data-i18n="progresso"></div>
      <div class="barra" role="progressbar" aria-label="Required answers" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barraPct"></span></div>
      <div class="pct" id="rotuloPct">0%</div>
    </div>
  </aside>

  <main>

    <!-- ============ I. SEU SALÃO ============ -->
    <section class="bloco" id="s1">
      <div class="cabeca"><span class="num">I</span><h2 data-i18n="s1t"></h2></div>
      <p class="descricao" data-i18n="s1d"></p>
      <div class="card">
        <div class="campo">
          <label><span data-i18n="l_businessType"></span></label>
          <div class="opcoes col3">
            <label class="radio-card"><input type="radio" name="businessType" value="Salão de cabelo"><span class="face"><b data-i18n="bt_hair"></b></span></label>
            <label class="radio-card"><input type="radio" name="businessType" value="Studio de beleza"><span class="face"><b data-i18n="bt_studio"></b></span></label>
            <label class="radio-card"><input type="radio" name="businessType" value="Barbearia"><span class="face"><b data-i18n="bt_barber"></b></span></label>
            <label class="radio-card"><input type="radio" name="businessType" value="E-commerce"><span class="face"><b data-i18n="bt_ecom"></b></span></label>
            <label class="radio-card"><input type="radio" name="businessType" value="Outro"><span class="face"><b data-i18n="bt_other"></b></span></label>
          </div>
        </div>
        <div class="grid2">
          <div class="campo">
            <label for="nomeSalao"><span data-i18n="l_nomeSalao"></span></label>
            <input type="text" id="nomeSalao" data-i18n-ph="p_nomeSalao">
          </div>
          <div class="campo">
            <label for="responsavel"><span data-i18n="l_responsavel"></span> <span class="opc" data-i18n="opc_contato"></span></label>
            <input type="text" id="responsavel" data-i18n-ph="p_responsavel">
          </div>
        </div>
        <div class="grid3">
          <div class="campo">
            <label for="whatsResp"><span data-i18n="l_whatsResp"></span></label>
            <div class="ajuda" data-i18n="help_phone"></div>
            <input type="tel" id="whatsResp" data-i18n-ph="p_whatsResp">
          </div>
          <div class="campo">
            <label for="emailResp"><span data-i18n="l_emailResp"></span> <span class="opc" data-i18n="optional"></span></label>
            <input type="email" id="emailResp" data-i18n-ph="p_emailResp">
          </div>
          <div class="campo">
            <label for="instagram"><span data-i18n="l_instagram"></span> <span class="opc" data-i18n="optional"></span></label>
            <input type="text" id="instagram" data-i18n-ph="p_instagram">
          </div>
        </div>
        <div class="campo">
          <label for="endereco"><span data-i18n="l_endereco"></span></label>
          <input type="text" id="endereco" data-i18n-ph="p_endereco">
        </div>
        <div class="campo">
          <label for="cidadeEstado"><span data-i18n="l_cidadeEstado"></span></label>
          <div class="ajuda" data-i18n="help_cidadeEstado"></div>
          <input type="text" id="cidadeEstado" data-i18n-ph="p_cidadeEstado">
        </div>
        <div class="grid2">
          <div class="campo">
            <label><span data-i18n="l_estacionamento"></span></label>
            <div class="sn">
              <label><input type="radio" name="estacionamento" value="Sim"><span class="face" data-i18n="yes"></span></label>
              <label><input type="radio" name="estacionamento" value="Não"><span class="face" data-i18n="no"></span></label>
            </div>
          </div>
          <div class="campo">
            <label for="referencia"><span data-i18n="l_referencia"></span></label>
            <input type="text" id="referencia" data-i18n-ph="p_referencia">
          </div>
        </div>
        <div class="campo">
          <label for="site"><span data-i18n="l_site"></span> <span class="opc" data-i18n="optional"></span></label>
          <input type="url" id="site" data-i18n-ph="p_site">
        </div>
        <div class="campo">
          <label for="unidade"><span data-i18n="l_unidade"></span></label>
          <input type="text" id="unidade" data-i18n-ph="p_unidade">
        </div>
      </div>
    </section>

    <!-- ============ II. HORÁRIOS ============ -->
    <section class="bloco" id="s2">
      <div class="cabeca"><span class="num">II</span><h2 data-i18n="s2t"></h2></div>
      <p class="descricao" data-i18n="s2d"></p>
      <div class="card">
        <div class="grid2">
          <div class="campo">
            <label for="fuso"><span data-i18n="l_fuso"></span></label>
            <div class="ajuda" data-i18n="help_fuso"></div>
            <select id="fuso" data-vl>
              <option value="America/New_York">America/New_York</option>
              <option value="America/Chicago">America/Chicago</option>
              <option value="America/Denver">America/Denver</option>
              <option value="America/Los_Angeles">America/Los_Angeles</option>

function optionText(spec,v){ if(v==='') return t(spec.ph||'opt_select'); return vl(v); }
function createRow(type, values={}){
 const row=document.createElement('div'); row.className='linha-campos'; row.dataset.type=type;
 for(const spec of SPECS[type]){
  const wrap=document.createElement('label');
  const title=document.createElement('span');
  const el=document.createElement(spec.kind==='select'?'select':'input');
  if(spec.kind!=='select') el.type=spec.kind;
  else for(const v of spec.opts){const o=document.createElement('option');o.value=v;o.textContent=optionText(spec,v);el.append(o);}
  el.id='linha-'+(++serial); wrap.htmlFor=el.id; el.className=spec.cls; el.dataset.key=spec.k;
  el.value=typeof values[spec.k]==='string'?values[spec.k]:'';
  if(spec.kind==='number'){el.min=spec.k==='i'?'0':'1';el.step='1';}
  if(spec.cls==='s-preco')el.inputMode='decimal';
  wrap.append(title,el);row.append(wrap);
 }
 const action=document.createElement('div');action.className='acao-linha';
 const btn=document.createElement('button');btn.type='button';btn.className='remover';btn.textContent='✕';
 btn.setAttribute('aria-label',t('removeRow'));
 btn.addEventListener('click',()=>removerLinha(btn));action.append(btn);row.append(action);
 $(tableId(type)).append(row);return row;
}
function relabelRows(){
 for(const type of Object.keys(SPECS))for(const row of rows(tableId(type))){
  for(const el of row.querySelectorAll('[data-key]')){
   const spec=SPECS[type].find(s=>s.k===el.dataset.key);
   const span=el.closest('label').querySelector('span');
   if(spec&&span)span.textContent=t(spec.label);
   for(const o of el.options||[])if(o.value!==''||spec.ph)o.textContent=optionText(spec,o.value);
  }
 }
}

function snapshot(){
 const dados={version:VERSION,campos:{},radios:{},checkboxes:{},horarios:[],servicos:[],equipe:[]};
 for(const e of fields())dados.campos[e.id]=e.type==='checkbox'?e.checked:e.value;
 for(const e of document.querySelectorAll('input[type=radio]'))dados.radios[e.name]=radio(e.name);
 for(const e of document.querySelectorAll('input[type=checkbox][name]')){
  if(!dados.checkboxes[e.name])dados.checkboxes[e.name]=[];
  if(e.checked)dados.checkboxes[e.name].push(e.value);
 }
 for(const type of Object.keys(SPECS))dados[type]=rows(tableId(type)).map(row=>Object.fromEntries([...row.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.value])));
 return dados;
}
function applyData(data, legacy=false){
 if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('estrutura inválida');
 if(!legacy&&data.version!==VERSION)throw new Error('versão não suportada');
 restoring=true;
 try{
  for(const e of fields()){
   const value=data.campos?.[e.id];
   if(e.type==='checkbox')e.checked=value===true;
   else if(typeof value==='string')e.value=value;
  }
  for(const e of document.querySelectorAll('input[type=radio]'))e.checked=(legacy?data.campos?.['r_'+e.name]:data.radios?.[e.name])===e.value;
  for(const e of document.querySelectorAll('input[type=checkbox][name]'))e.checked=Array.isArray(data.checkboxes?.[e.name])&&data.checkboxes[e.name].includes(e.value);
  for(const type of Object.keys(SPECS))if(Array.isArray(data[type])){
   rows(tableId(type)).forEach(e=>e.remove());
   for(const values of data[type])if(values&&typeof values==='object')createRow(type,values);
  }
 }finally{restoring=false;}
 atualizarOutraPlataforma();calcularProgresso();
}

function parsePrice(value){
 const s=String(value).trim();
 if(!/^(?:\d+(?:[.,]\d{1,2})?|\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)$/.test(s))return NaN;
 const lastSep=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));
 const dec=/[.,]\d{1,2}$/.test(s)&&/\d/.test(s[lastSep-1]||'');
 let n=s;
 if(dec&&s[lastSep]){n=s.slice(0,lastSep).replace(/[.,]/g,'')+'.'+s.slice(lastSep+1);}
 else{n=s.replace(/[.,]/g,'');}
 const num=Number(n);return Number.isFinite(num)?num:NaN;
}
const positiveInt=s=>/^\d+$/.test(s)&&Number(s)>0&&Number.isSafeInteger(Number(s));
function validPhone(value){
 if(!/^[+\d\s().\-]+$/.test(value))return false;
 let d=value.replace(/\D/g,'');
 if((d.length===12||d.length===13)&&d.startsWith('55'))d=d.slice(2);
 if(d.length<10||d.length>11)return false;
 if(/^(\d)\1+$/.test(d))return false;
 if(d.length===11){ if(d[0]==='1'){ if(d[1]>='2')return true; return d[2]==='9'; } return d[2]==='9'; }
 return true;
}
const normPhone=v=>v.replace(/\s+/g,' ').trim();
function addrOk(){
 const a=text('endereco');
 return a.length>=12&&a.split(/[\s,;—-]+/).filter(Boolean).length>=4&&/(?:\d|\bs\s*\/\s*n\b|sem número|no number)/i.test(a);
}
function requiredChecks(){
 const p=radio('plataforma');
 const completeService=rows('tabelaServicos').some(row=>{
  const v=k=>row.querySelector('[data-key="'+k+'"]').value.trim();
  return v('n')&&v('t')&&positiveInt(v('d'))&&(v('t')==='Sob avaliação'?!v('p')||parsePrice(v('p'))>0:parsePrice(v('p'))>0);
 });
 return [
  ['nomeSalao',!!text('nomeSalao'),'er_nomeSalao'],
  ['responsavel',!!text('responsavel'),'er_responsavel'],
  ['whatsResp',validPhone(text('whatsResp')),'er_whats'],
  ['endereco',addrOk(),'er_endereco'],
 ['cidadeEstado',!!text('cidadeEstado'),'er_cidade'],
  ['plataforma',!!p&&(p!=='Outra'||!!text('outraPlataforma')),'er_plataforma'],
  ['whatsappHoje',!!radio('whatsappHoje'),'er_whatsHoje'],
  ['serviceLang',!!radio('serviceLang'),'er_serviceLang'],
  ['canais',!!text('canais'),'er_canais'],
  ['servicos',completeService,'er_service'],
  ['cienteVirtual',$('cienteVirtual').checked,'er_ciente']
 ];
}
function targetFor(id){
 if(id==='servicos')return rows('tabelaServicos')[0]?.querySelector('input')||document.querySelector('[onclick="adicionarServico()"]');
 if(['plataforma','whatsappHoje','serviceLang'].includes(id))return document.querySelector('input[name="'+id+'"]');
 return $(id);
}
function validate(){
 const errors=[];const add=(el,msgKey)=>{if(el&&!errors.some(e=>e.el===el&&e.msg===msgKey))errors.push({el,msg:t(msgKey)});};
 for(const [id,ok,msgKey] of requiredChecks())if(!ok)add(targetFor(id),msgKey);
 if(radio('plataforma')==='Outra'&&!text('outraPlataforma'))add($('outraPlataforma'),'er_outra');
 for(const e of fields()){
  if(e.value&&['email','url'].includes(e.type)&&!e.validity.valid)add(e,e.type==='url'?'er_url':'er_email');
 }
 for(const id of ['numeroComercial','telefoneHumano'])if(text(id)&&!validPhone(text(id)))add($(id),'er_phoneOpt');
 const intervals=[];
 for(const row of rows('tabelaHorarios')){
  const day=row.querySelector('.h-dia'),a=row.querySelector('.h-abre'),f=row.querySelector('.h-fecha');
  if(!a.value&&!f.value)continue;
  if(!day.value)add(day,'er_day');
  if(!a.value)add(a,'er_abre');
  if(!f.value)add(f,'er_fecha');
  if(a.value&&f.value){
   if(a.value>=f.value)add(f,'er_invert');
   else if(day.value){
    for(const old of intervals)if(old.day===day.value&&a.value<old.end&&f.value>old.start){add(a,'er_overlap');add(old.el,'er_overlap');}
    intervals.push({day:day.value,start:a.value,end:f.value,el:a});
   }
  }
 }
 for(const row of rows('tabelaServicos')){
  const at=k=>row.querySelector('[data-key="'+k+'"]');const v=k=>at(k).value.trim();
  if(!SPECS.servicos.some(s=>v(s.k)))continue;
  if(!v('n'))add(at('n'),'er_snome');
  if(!v('t'))add(at('t'),'er_stipo');
  if((v('t')!=='Sob avaliação'||v('p'))&&!(parsePrice(v('p'))>0))add(at('p'),'er_spreco');
  if(!positiveInt(v('d')))add(at('d'),'er_sdur');
  if(v('i')&&(!/^\d+$/.test(v('i'))||!Number.isSafeInteger(Number(v('i')))))add(at('i'),'er_sint');
 }
 for(const row of rows('tabelaEquipe')){
  const inputs=[...row.querySelectorAll('input')];
  if(inputs.some(e=>e.value.trim()))for(const e of inputs)if(!e.value.trim())add(e,'er_equipe');
 }
 if(text('duvidaFrequente')&&!text('respostaFaq'))add($('respostaFaq'),'er_faq');
 if(text('respostaFaq')&&!text('duvidaFrequente'))add($('duvidaFrequente'),'er_faq2');
 return errors.sort((a,b)=>a.el===b.el?0:(a.el.compareDocumentPosition(b.el)&Node.DOCUMENT_POSITION_FOLLOWING?-1:1));
}
function renderErrors(errors,focus=true){
 document.querySelectorAll('[aria-invalid=true]').forEach(e=>{e.removeAttribute('aria-invalid');e.classList.remove('falta');});
 document.querySelectorAll('[data-error-ref]').forEach(e=>{
  const ids=(e.getAttribute('aria-describedby')||'').split(' ').filter(id=>id&&id!==e.dataset.errorRef);
  if(ids.length)e.setAttribute('aria-describedby',ids.join(' '));else e.removeAttribute('aria-describedby');delete e.dataset.errorRef;
 });
 document.querySelectorAll('.erro-campo').forEach(e=>e.remove());
 const box=$('avisoCampos');box.replaceChildren();box.classList.toggle('visivel',errors.length>0);
 if(!errors.length)return;
 const title=document.createElement('p');title.textContent=t('er_title').replace('{n}',String(errors.length));box.append(title);
 const list=document.createElement('ul');box.append(list);
 const refs=new Map();
 for(const {el,msg} of errors){
  if(!el.id)el.id='campo-'+(++serial);
  let error=refs.get(el);
  if(!error){
   error=document.createElement('span');error.className='erro-campo';error.id='erro-'+el.id;error.textContent=msg;el.after(error);refs.set(el,error);
   el.setAttribute('aria-invalid','true');el.classList.add('falta');
   const old=el.getAttribute('aria-describedby');el.setAttribute('aria-describedby',(old?old+' ':'')+error.id);el.dataset.errorRef=error.id;
  }else error.textContent+=' '+msg;
  const li=document.createElement('li'),a=document.createElement('a');a.href='#'+el.id;a.textContent=msg;
  a.addEventListener('click',ev=>{ev.preventDefault();el.focus();});li.append(a);list.append(li);
 }
 if(focus)errors[0].el.focus();
}
function labelFor(e){return document.querySelector('label[for="'+e.id+'"]')?.textContent.replace(/\s+/g,' ').trim()||e.id;}
function pendencias(data){
 const p=[];
 if(!data.horarios.some(h=>h.a&&h.f))p.push(t('pend_hours'));
 if(!data.equipe.some(e=>e.n))p.push(t('pend_team'));
 for(const id of ['unidade','numeroComercial','metaWhats','agendasRecursos','verificacao','dadosMinimos','fallback','horarioHumano','volume','picos','acoesAutorizadas','aprovador','gravacaoRetencao'])if(!data.campos[id])p.push(labelFor($(id))+': '+t('pend_notinformed')+'.');
 for(const [id,value] of Object.entries(data.campos))if(typeof value==='string'&&/não sei|not sure|don.t know|desconhe|a definir|to be defined/i.test(value))p.push(labelFor($(id))+': '+value);
 for(const [name,value] of Object.entries(data.radios))if(value==='Não sei')p.push(t(RADIO_LABELS[name]||name)+': '+vl(value));
 if(data.campos.fuso==='Outro / não sei'&&!data.campos.fusoOutro)p.push(t('pend_fuso'));
 p.push(t('pend_final'));
 return p;
}
function fmtVal(type,k,v){ if(v==null||v==='')return t('sum_ni'); if(k==='p')return 'US$ '+v; return vl(v); }
function buildPrivate(data){
 const lines=[t('sum_title'),t('sum_l1'),t('sum_l2'),t('sum_l3'),t('sum_l4'),''];
 for(const e of fields()){
  let value=data.campos[e.id];
  if(value===''||value===false)continue;
  if(PHONE_FIELDS.includes(e.id))value=normPhone(value);
  lines.push(labelFor(e)+': '+(value===true?t('yes'):value));
 }
 lines.push('\n'+t('sum_choices'));
 for(const [name,value] of Object.entries(data.radios))if(value)lines.push(t(RADIO_LABELS[name]||name)+': '+vl(value));
 for(const [name,vals] of Object.entries(data.checkboxes))if(vals.length)lines.push(t(CHECKBOX_LABELS[name]||name)+': '+vals.map(vl).join('; '));
 const sec={horarios:'sum_hours',servicos:'sum_services',equipe:'sum_team'};
 for(const type of Object.keys(SPECS)){
  lines.push('\n'+t(sec[type]));
  if(type==='servicos')lines.push(t('sum_currency')+': '+t('currency'));
  for(const row of data[type]){
   if(!Object.values(row).some(Boolean))continue;
   lines.push(SPECS[type].map(s=>t(s.label)+': '+fmtVal(type,s.k,row[s.k])).join(' | '));
  }
 }
 lines.push('\n'+t('sum_open'),...pendencias(data).map(s=>'- '+s));
 return lines.join('\n');
}
function calcularProgresso(){
 const checks=requiredChecks();const n=checks.filter(c=>c[1]).length;const pct=Math.round(n/checks.length*100);
 $('barraPct').style.width=pct+'%';$('barraPct').parentElement.setAttribute('aria-valuenow',String(pct));
